<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics lbl</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f5f5f5;
    color: #222;
}

h1 {
    margin-top: 0;
}

h2 {
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px;
    font-size: 16px;
    resize: vertical;
    border: 1px solid #bbb;
    border-radius: 6px;
    background: white;
}

button {
    padding: 8px 14px;
    border: 1px solid #aaa;
    border-radius: 5px;
    background: white;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #eee;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.section {
    margin-top: 25px;
}

.group {
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 12px;
    padding: 12px;
}

.group-title {
    font-weight: bold;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #ddd;
}

.line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.line:last-child {
    border-bottom: none;
}

.line-text {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.saved-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #ddd;
}

.saved-line:last-child {
    border-bottom: none;
}

.saved-text {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.empty {
    color: #888;
    padding: 8px 0;
}

#saved,
#cleanLyrics {
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
}

#savedHeader,
#cleanLyricsHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

#savedHeader h2,
#cleanLyricsHeader h2 {
    margin: 0;
}

#cleanLyricsText {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
}
</style>
</head>
<body>

<h1>Lyrics lbl</h1>

<textarea id="input" placeholder="Paste lyrics here..."></textarea>

<div class="controls">
    <button id="processButton">✅Process</button>
    <button id="resetButton">❌Reset</button>
</div>

<div class="section">
    <h2>Lyrics</h2>
    <div id="output">
        <div class="empty">No lyrics processed yet.</div>
    </div>
</div>

<div class="section">
    <div id="savedHeader">
        <h2>Saved</h2>
        <button id="copyAllButton">Copy All</button>
    </div>

    <div id="saved">
        <div class="empty">No saved lyrics.</div>
    </div>
</div>

<div class="section">
    <div id="cleanLyricsHeader">
        <h2>Clean Lyrics</h2>
        <button id="copyCleanButton">Copy All</button>
    </div>

    <div id="cleanLyrics">
        <div class="empty">No clean lyrics yet.</div>
    </div>
</div>

<script>
const input = document.getElementById("input");
const processButton = document.getElementById("processButton");
const resetButton = document.getElementById("resetButton");
const copyAllButton = document.getElementById("copyAllButton");
const copyCleanButton = document.getElementById("copyCleanButton");
const output = document.getElementById("output");
const saved = document.getElementById("saved");
const cleanLyrics = document.getElementById("cleanLyrics");

const INPUT_KEY = "lyricsCleaner_input";
const LYRICS_KEY = "lyricsCleaner_lyrics";
const SAVED_KEY = "lyricsCleaner_saved";
const CLEAN_KEY = "lyricsCleaner_clean";

let lyricsLines = JSON.parse(localStorage.getItem(LYRICS_KEY) || "[]");
let savedLines = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
let cleanLines = JSON.parse(localStorage.getItem(CLEAN_KEY) || "[]");

function isBracketLine(line) {
    return /^\[.*\]$/.test(line.trim());
}

function cleanLine(line) {
    line = line.trim();

    if (!line) {
        return "";
    }

    if (isBracketLine(line)) {
        return line;
    }

    line = line.replace(/\s*\([^()]*\)\s*/g, " ");
    line = line.replace(/\s{2,}/g, " ").trim();

    return line;
}

function processLyrics() {
    const text = input.value;

    if (!text.trim()) {
        lyricsLines = [];
        cleanLines = [];

        localStorage.setItem(LYRICS_KEY, JSON.stringify(lyricsLines));
        localStorage.setItem(CLEAN_KEY, JSON.stringify(cleanLines));

        renderLyrics();
        renderCleanLyrics();
        return;
    }

    const firstBracket = text.indexOf("[");
    const lastBracket = text.lastIndexOf("]");

    let lyricsText;

    if (firstBracket !== -1 && lastBracket !== -1 && lastBracket >= firstBracket) {
        lyricsText = text.slice(firstBracket, lastBracket + 1);
    } else {
        lyricsText = text;
    }

    lyricsLines = lyricsText
        .split(/\r?\n/)
        .map(cleanLine)
        .filter(line => line !== "");

    cleanLines = lyricsLines.filter(line => !isBracketLine(line));

    localStorage.setItem(LYRICS_KEY, JSON.stringify(lyricsLines));
    localStorage.setItem(CLEAN_KEY, JSON.stringify(cleanLines));

    renderLyrics();
    renderCleanLyrics();
}

function renderLyrics() {
    output.innerHTML = "";

    if (lyricsLines.length === 0) {
        output.innerHTML = '<div class="empty">No lyrics processed yet.</div>';
        return;
    }

    let currentGroup = null;

    lyricsLines.forEach(line => {
        if (isBracketLine(line)) {
            currentGroup = document.createElement("div");
            currentGroup.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = line;

            currentGroup.appendChild(title);
            output.appendChild(currentGroup);

            return;
        }

        if (!currentGroup) {
            currentGroup = document.createElement("div");
            currentGroup.className = "group";
            output.appendChild(currentGroup);
        }

        const row = document.createElement("div");
        row.className = "line";

        const textElement = document.createElement("span");
        textElement.className = "line-text";
        textElement.textContent = line;

        const copyButton = document.createElement("button");
        copyButton.textContent = "Copy";

        copyButton.addEventListener("click", () => {
            copyText(line, copyButton);
        });

        const saveButton = document.createElement("button");
        saveButton.textContent = "Save";

        saveButton.addEventListener("click", () => {
            saveLine(line);
        });

        row.appendChild(textElement);
        row.appendChild(copyButton);
        row.appendChild(saveButton);

        currentGroup.appendChild(row);
    });
}

async function copyText(text, button) {
    try {
        await navigator.clipboard.writeText(text);

        const originalText = button.textContent;
        button.textContent = "Did!";

        setTimeout(() => {
            button.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = button.textContent;
        button.textContent = "Did!";

        setTimeout(() => {
            button.textContent = originalText;
        }, 1000);
    }
}

function saveLine(text) {
    savedLines.push(text);

    localStorage.setItem(
        SAVED_KEY,
        JSON.stringify(savedLines)
    );

    renderSaved();
}

function renderSaved() {
    saved.innerHTML = "";

    if (savedLines.length === 0) {
        saved.innerHTML = '<div class="empty">No saved lyrics.</div>';
        return;
    }

    savedLines.forEach(text => {
        const row = document.createElement("div");
        row.className = "saved-line";

        const textElement = document.createElement("span");
        textElement.className = "saved-text";
        textElement.textContent = text;

        const copyButton = document.createElement("button");
        copyButton.textContent = "Copy";

        copyButton.addEventListener("click", () => {
            copyText(text, copyButton);
        });

        row.appendChild(textElement);
        row.appendChild(copyButton);

        saved.appendChild(row);
    });
}

async function copyAll() {
    if (savedLines.length === 0) {
        return;
    }

    const text = savedLines.join("\n");

    try {
        await navigator.clipboard.writeText(text);

        const originalText = copyAllButton.textContent;
        copyAllButton.textContent = "Copied";

        setTimeout(() => {
            copyAllButton.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = copyAllButton.textContent;
        copyAllButton.textContent = "Copied";

        setTimeout(() => {
            copyAllButton.textContent = originalText;
        }, 1000);
    }
}

async function copyCleanLyrics() {
    if (cleanLines.length === 0) {
        return;
    }

    const text = cleanLines.join("\n");

    try {
        await navigator.clipboard.writeText(text);

        const originalText = copyCleanButton.textContent;
        copyCleanButton.textContent = "Copied";

        setTimeout(() => {
            copyCleanButton.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = copyCleanButton.textContent;
        copyCleanButton.textContent = "Copied";

        setTimeout(() => {
            copyCleanButton.textContent = originalText;
        }, 1000);
    }
}

function renderCleanLyrics() {
    cleanLyrics.innerHTML = "";

    if (cleanLines.length === 0) {
        cleanLyrics.innerHTML = '<div class="empty">No clean lyrics yet.</div>';
        return;
    }

    const textElement = document.createElement("div");
    textElement.id = "cleanLyricsText";
    textElement.textContent = cleanLines.join("\n");

    cleanLyrics.appendChild(textElement);
}

function resetAll() {
    input.value = "";
    lyricsLines = [];
    savedLines = [];
    cleanLines = [];

    localStorage.removeItem(INPUT_KEY);
    localStorage.removeItem(LYRICS_KEY);
    localStorage.removeItem(SAVED_KEY);
    localStorage.removeItem(CLEAN_KEY);

    output.innerHTML = '<div class="empty">No lyrics processed yet.</div>';
    saved.innerHTML = '<div class="empty">No saved lyrics.</div>';
    cleanLyrics.innerHTML = '<div class="empty">No clean lyrics yet.</div>';
}

input.addEventListener("input", () => {
    localStorage.setItem(INPUT_KEY, input.value);
});

processButton.addEventListener("click", processLyrics);
resetButton.addEventListener("click", resetAll);
copyAllButton.addEventListener("click", copyAll);
copyCleanButton.addEventListener("click", copyCleanLyrics);

input.value = localStorage.getItem(INPUT_KEY) || "";

renderLyrics();
renderSaved();
renderCleanLyrics();
</script>

</body>
</html>
