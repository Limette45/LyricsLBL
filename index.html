<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics lbl</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    background: #f3f5f8;
    color: #252b36;
}

h1 {
    margin-top: 0;
}

h2 {
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 220px;
    padding: 12px;
    font-size: 16px;
    resize: vertical;
    border: 1px solid #cbd3df;
    border-radius: 6px;
    background: #fff;
    color: #252b36;
}

textarea:focus {
    outline: 2px solid #9bbcf5;
    border-color: #477fe0;
}

button {
    padding: 8px 14px;
    border: 1px solid #cbd3df;
    border-radius: 5px;
    background: #fff;
    color: #303949;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s, border-color 0.15s;
}

button:hover {
    background: #e9edf3;
}

.page-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.page-button {
    min-width: 70px;
}

.page-button.active {
    background: #34445e;
    color: white;
    border-color: #34445e;
}

.controls {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#processButton {
    background: #2563b8;
    color: white;
    border-color: #2563b8;
}

#processButton:hover {
    background: #1d4f96;
}

#resetButton {
    background: #fff0f0;
    color: #b42332;
    border-color: #e8b6bc;
}

#resetButton:hover {
    background: #ffe0e3;
}

#savedListButton {
    background: #e8effc;
    color: #244f99;
    border-color: #b5c9ed;
}

#savedListButton:hover {
    background: #d5e3fa;
}

.section {
    margin-top: 25px;
}

.group {
    background: white;
    border: 1px solid #d5dce6;
    border-radius: 6px;
    margin-bottom: 12px;
    padding: 12px;
}

.group-title {
    font-weight: bold;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid #e0e5ec;
}

.line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #edf0f4;
}

.line:last-child {
    border-bottom: none;
}

.line-text {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 18px;
    line-height: 1.4;
}

.line button {
    flex-shrink: 0;
    width: 54px;
    padding: 10px 0;
    font-size: 12px;
    font-weight: bold;
}

.line button.save-button {
    background: #e4f4e9;
    color: #176b38;
    border-color: #8bc9a0;
}

.line button.save-button:hover {
    background: #ccebd6;
}

.line button.undo-button {
    background: #fff0dc;
    color: #984b08;
    border-color: #edbd83;
}

.line button.undo-button:hover {
    background: #ffe1b8;
}

.saved-line {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid #e0e5ec;
}

.saved-line:last-child {
    border-bottom: none;
}

.saved-text {
    flex: 1;
    min-width: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.empty {
    color: #7b8493;
    padding: 8px 0;
}

#saved,
#cleanLyrics {
    background: white;
    border: 1px solid #d5dce6;
    border-radius: 6px;
    padding: 10px 14px;
}

#savedHeader,
#cleanLyricsHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

#savedHeader h2,
#cleanLyricsHeader h2 {
    margin: 0;
}

#copyAllButton,
#copyCleanButton {
    background: #e8effc;
    color: #244f99;
    border-color: #b5c9ed;
}

#copyAllButton:hover,
#copyCleanButton:hover {
    background: #d5e3fa;
}

#backToTopButton {
    background: #e8effc;
    color: #244f99;
    border-color: #b5c9ed;
}

#backToTopButton:hover {
    background: #d5e3fa;
}

#cleanLyricsText {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.6;
}
</style>
</head>
<body id="top">

<h1>🎶Lyrics lbl</h1>

<div class="page-controls">
    <button class="page-button active" data-page="1">Page 1</button>
    <button class="page-button" data-page="2">Page 2</button>
    <button class="page-button" data-page="3">Page 3</button>
    <button class="page-button" data-page="4">Page 4</button>
</div>

<textarea id="input" placeholder="Paste lyrics here..."></textarea>

<div class="controls">
    <button id="processButton">✅Process</button>
    <button id="resetButton">❌Reset</button>
    <button id="savedListButton">Saved List</button>
</div>

<div class="section">
    <h2>Lyrics</h2>
    <div id="output">
        <div class="empty">No lyrics processed yet.</div>
    </div>
</div>

<div class="section">
    <div id="savedHeader">
        <h2>Saved</h2>
        <button id="copyAllButton">Copy All</button>
    </div>

    <div id="saved">
        <div class="empty">No saved lyrics.</div>
    </div>

    <div style="margin-top: 10px;">
        <button id="backToTopButton">Back to Top</button>
    </div>
</div>

<div class="section">
    <div id="cleanLyricsHeader">
        <h2>Clean Lyrics</h2>
        <button id="copyCleanButton">Copy All</button>
    </div>

    <div id="cleanLyrics">
        <div class="empty">No clean lyrics yet.</div>
    </div>
</div>

<script>
const input = document.getElementById("input");
const processButton = document.getElementById("processButton");
const resetButton = document.getElementById("resetButton");
const savedListButton = document.getElementById("savedListButton");
const backToTopButton = document.getElementById("backToTopButton");
const copyAllButton = document.getElementById("copyAllButton");
const copyCleanButton = document.getElementById("copyCleanButton");
const output = document.getElementById("output");
const saved = document.getElementById("saved");
const cleanLyrics = document.getElementById("cleanLyrics");
const pageButtons = document.querySelectorAll(".page-button");

let currentPage =
    Number(localStorage.getItem("lyricsCleaner_currentPage")) || 1;

let lyricsLines = [];
let savedLines = [];
let cleanLines = [];

function getKey(type) {
    return `lyricsCleaner_page${currentPage}_${type}`;
}

function loadPage() {
    lyricsLines = JSON.parse(
        localStorage.getItem(getKey("lyrics")) || "[]"
    );

    savedLines = JSON.parse(
        localStorage.getItem(getKey("saved")) || "[]"
    );

    savedLines = [...new Set(savedLines)];

    localStorage.setItem(
        getKey("saved"),
        JSON.stringify(savedLines)
    );

    cleanLines = JSON.parse(
        localStorage.getItem(getKey("clean")) || "[]"
    );

    input.value = localStorage.getItem(getKey("input")) || "";

    pageButtons.forEach(button => {
        button.classList.toggle(
            "active",
            Number(button.dataset.page) === currentPage
        );
    });

    renderLyrics();
    renderSaved();
    renderCleanLyrics();
}

function switchPage(page) {
    currentPage = page;

    localStorage.setItem(
        "lyricsCleaner_currentPage",
        currentPage
    );

    loadPage();
}

function isBracketLine(line) {
    return /^\[.*\]$/.test(line.trim());
}

function isTooLong(line) {
    return line.trim().split(/\s+/).length >= 20;
}

function cleanLine(line) {
    line = line.trim();

    if (!line) {
        return "";
    }

    if (isBracketLine(line)) {
        return line;
    }

    line = line.replace(/\s*\([^()]*\)\s*/g, " ");
    line = line.replace(/\s{2,}/g, " ").trim();

    if (isTooLong(line)) {
        return "";
    }

    return line;
}

function processLyrics() {
    const text = input.value;

    if (!text.trim()) {
        lyricsLines = [];
        cleanLines = [];

        localStorage.setItem(
            getKey("lyrics"),
            JSON.stringify(lyricsLines)
        );

        localStorage.setItem(
            getKey("clean"),
            JSON.stringify(cleanLines)
        );

        renderLyrics();
        renderCleanLyrics();
        return;
    }

    const lines = text.split(/\r?\n/);

    let firstBracketIndex = -1;
    let bracketLineIndexes = [];

    lines.forEach((line, index) => {
        if (isBracketLine(line)) {
            bracketLineIndexes.push(index);

            if (firstBracketIndex === -1) {
                firstBracketIndex = index;
            }
        }
    });

    if (firstBracketIndex === -1) {
        lyricsLines = lines
            .map(cleanLine)
            .filter(line => line !== "");
    } else {
        const lastBracketIndex =
            bracketLineIndexes[bracketLineIndexes.length - 1];

        lyricsLines = lines
            .slice(firstBracketIndex, lastBracketIndex)
            .map(cleanLine)
            .filter(line => line !== "");
    }

    cleanLines = lyricsLines.filter(
        line => !isBracketLine(line)
    );

    localStorage.setItem(
        getKey("lyrics"),
        JSON.stringify(lyricsLines)
    );

    localStorage.setItem(
        getKey("clean"),
        JSON.stringify(cleanLines)
    );

    renderLyrics();
    renderCleanLyrics();
}

function renderLyrics() {
    output.innerHTML = "";

    if (lyricsLines.length === 0) {
        output.innerHTML =
            '<div class="empty">No lyrics processed yet.</div>';
        return;
    }

    let currentGroup = null;

    lyricsLines.forEach(line => {
        if (isBracketLine(line)) {
            currentGroup = document.createElement("div");
            currentGroup.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = line;

            currentGroup.appendChild(title);
            output.appendChild(currentGroup);

            return;
        }

        if (!currentGroup) {
            currentGroup = document.createElement("div");
            currentGroup.className = "group";
            output.appendChild(currentGroup);
        }

        const row = document.createElement("div");
        row.className = "line";

        const textElement = document.createElement("span");
        textElement.className = "line-text";
        textElement.textContent = line;

        const saveButton = document.createElement("button");
        const isSaved = savedLines.includes(line);

        saveButton.textContent = isSaved ? "Undo" : "Save";
        saveButton.className = isSaved ? "undo-button" : "save-button";

        saveButton.addEventListener("click", () => {
            if (savedLines.includes(line)) {
                unsaveLine(line);
            } else {
                saveLine(line);
            }
        });

        row.appendChild(textElement);
        row.appendChild(saveButton);

        currentGroup.appendChild(row);
    });
}

async function copyText(text, button) {
    try {
        await navigator.clipboard.writeText(text);

        const originalText = button.textContent;
        button.textContent = "Did!";

        setTimeout(() => {
            button.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = button.textContent;
        button.textContent = "Did!";

        setTimeout(() => {
            button.textContent = originalText;
        }, 1000);
    }
}

function saveLine(text) {
    if (savedLines.includes(text)) {
        return;
    }

    savedLines.push(text);

    localStorage.setItem(
        getKey("saved"),
        JSON.stringify(savedLines)
    );

    renderSaved();
    renderLyrics();
}

function unsaveLine(text) {
    savedLines = savedLines.filter(
        line => line !== text
    );

    localStorage.setItem(
        getKey("saved"),
        JSON.stringify(savedLines)
    );

    renderSaved();
    renderLyrics();
}

function renderSaved() {
    saved.innerHTML = "";

    if (savedLines.length === 0) {
        saved.innerHTML =
            '<div class="empty">No saved lyrics.</div>';
        return;
    }

    savedLines.forEach(text => {
        const row = document.createElement("div");
        row.className = "saved-line";

        const textElement = document.createElement("span");
        textElement.className = "saved-text";
        textElement.textContent = text;

        const copyButton = document.createElement("button");
        copyButton.textContent = "Copy";

        copyButton.addEventListener("click", () => {
            copyText(text, copyButton);
        });

        row.appendChild(textElement);
        row.appendChild(copyButton);

        saved.appendChild(row);
    });
}

async function copyAll() {
    if (savedLines.length === 0) {
        return;
    }

    const text = savedLines.join("\n");

    try {
        await navigator.clipboard.writeText(text);

        const originalText = copyAllButton.textContent;
        copyAllButton.textContent = "Copied";

        setTimeout(() => {
            copyAllButton.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = copyAllButton.textContent;
        copyAllButton.textContent = "Copied";

        setTimeout(() => {
            copyAllButton.textContent = originalText;
        }, 1000);
    }
}

async function copyCleanLyrics() {
    if (cleanLines.length === 0) {
        return;
    }

    const text = cleanLines.join("\n");

    try {
        await navigator.clipboard.writeText(text);

        const originalText = copyCleanButton.textContent;
        copyCleanButton.textContent = "Copied";

        setTimeout(() => {
            copyCleanButton.textContent = originalText;
        }, 1000);
    } catch {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();

        const originalText = copyCleanButton.textContent;
        copyCleanButton.textContent = "Copied";

        setTimeout(() => {
            copyCleanButton.textContent = originalText;
        }, 1000);
    }
}

function renderCleanLyrics() {
    cleanLyrics.innerHTML = "";

    if (cleanLines.length === 0) {
        cleanLyrics.innerHTML =
            '<div class="empty">No clean lyrics yet.</div>';
        return;
    }

    const textElement = document.createElement("div");
    textElement.id = "cleanLyricsText";
    textElement.textContent = cleanLines.join("\n");

    cleanLyrics.appendChild(textElement);
}

function resetAll() {
    input.value = "";
    lyricsLines = [];
    savedLines = [];
    cleanLines = [];

    localStorage.removeItem(getKey("input"));
    localStorage.removeItem(getKey("lyrics"));
    localStorage.removeItem(getKey("saved"));
    localStorage.removeItem(getKey("clean"));

    output.innerHTML =
        '<div class="empty">No lyrics processed yet.</div>';

    saved.innerHTML =
        '<div class="empty">No saved lyrics.</div>';

    cleanLyrics.innerHTML =
        '<div class="empty">No clean lyrics yet.</div>';
}

input.addEventListener("input", () => {
    localStorage.setItem(
        getKey("input"),
        input.value
    );
});

processButton.addEventListener("click", processLyrics);
resetButton.addEventListener("click", resetAll);

savedListButton.addEventListener("click", () => {
    document.getElementById("savedHeader").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
});

backToTopButton.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});

copyAllButton.addEventListener("click", copyAll);
copyCleanButton.addEventListener("click", copyCleanLyrics);

pageButtons.forEach(button => {
    button.addEventListener("click", () => {
        switchPage(Number(button.dataset.page));
    });
});

loadPage();
</script>

</body>
</html>
